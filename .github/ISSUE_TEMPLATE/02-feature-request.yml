name: Feature request
description: Suggest an improvement to fft.
title: '[Feature]: '
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: >-
        Search existing issues first and report one problem at a time. Remove passwords, tokens,
        connection strings and player identifiers from text and attachments. For a suspected
        vulnerability, use the repository Security tab or its security policy instead of a public
        issue.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or workflow in fft that you want to improve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How should it work?
      description: Describe the result you would like. A concrete example helps.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part is affected?
      options:
        - Scenario execution
        - Lua test steps
        - Gameplay recording and replay
        - JSON reports
        - Other / not sure
  - type: textarea
    id: context
    attributes:
      label: Resource details (optional)
      description: >-
        Name the scenario and failing step, execution realm and adapter. Include the feature snippet
        and parser/runner output with example player data.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples (optional)
      description: Mention a workaround, another approach, or an image/link that explains the idea.
